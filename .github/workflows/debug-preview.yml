name: 網站 Debug 預覽

on:
  push:
    branches:
      - codex/debug
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiyao-debug-preview
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: 驗證並發布 Debug 測試站
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 讀取 GitHub 版本
        uses: actions/checkout@v4

      - name: 準備 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 驗證正式報價
        run: node scripts/validate-price-data.mjs

      - name: 同步網站資料
        run: node scripts/sync-price-data.mjs

      - name: 建置 Debug 網站
        run: node scripts/build.mjs
        env:
          REPAIR_RELEASE_CHANNEL: debug

      - name: 確認資料同步與 Debug 標示
        run: |
          node scripts/sync-price-data.mjs --check
          node -e "const fs=require('node:fs');const value=fs.readFileSync('dist/data/version.js','utf8');if(!value.includes('-debug'))throw new Error('Debug 版本標示未產生');"

      - name: 缺少 Cloudflare 金鑰時說明
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Debug 驗證與建置完成；Cloudflare GitHub 金鑰尚未完整設定，因此略過預覽發布。"

      - name: 發布到 Cloudflare Pages Debug 預覽
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=otrepair-price --branch=debug --commit-hash=${{ github.sha }}
